# eval_config.yaml
# ----------------
tau: 0.7        # cosine-similarity threshold for short answers

experiments:
  N-250-SIM:
    collection: turismo_native_chunk_250
    method: answer_with_similarity
    chunk_size: 250

  N-250-MQ:
    collection: turismo_native_chunk_250
    method: answer_with_multiquery
    chunk_size: 250

  N-250-HYB:
    collection: turismo_native_chunk_250
    method: answer_with_hybrid
    chunk_size: 250

  N-750-SIM:
    collection: turismo_native_chunk_750
    method: answer_with_similarity
    chunk_size: 750

  N-750-MQ:
    collection: turismo_native_chunk_750
    method: answer_with_multiquery
    chunk_size: 750

  N-750-HYB:
    collection: turismo_native_chunk_750
    method: answer_with_hybrid
    chunk_size: 750

  L-250-CC:
    collection: turismo_full
    method: answer_with_contextual
    chunk_size: 250

  L-750-CC:
    collection: turismo_full
    method: answer_with_contextual
    chunk_size: 750

